<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Przepisy 💪 — macros z Willys</title>
<meta name="description" content="Przepisy z TikToka/IG z policzonymi macrosami z prawdziwych produktów Willys.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
:root{
  --bg:#0b0d12; --card:#151923; --card2:#1c2230; --line:#2a3245;
  --text:#e8ecf4; --muted:#8b94a7;
  --protein:#4ade80; --kcal:#fb923c; --carbs:#60a5fa; --fat:#facc15;
  --bad:#f87171; --good:#4ade80; --warn:#fbbf24; --pink:#f472b6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;padding:18px 4px 14px}
header .logo{font-size:28px}
header h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
header .sub{color:var(--muted);font-size:12px;margin-top:-2px}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin:6px 0 14px;outline:none}
.search:focus{border-color:var(--protein)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.tag.on{background:var(--protein);color:#08240f;border-color:var(--protein);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;cursor:pointer;transition:transform .12s ease,border-color .12s}
.card:active{transform:scale(.985)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--card2)}
.card .body{padding:14px 16px 16px}
.card h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.card .by{color:var(--muted);font-size:13px;margin:2px 0 10px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:5px 10px;border-radius:10px;background:var(--card2);font-size:12px;color:var(--muted)}
.chip b{font-size:14px;font-weight:800}
.chip.pk b{color:var(--protein)} .chip.kc b{color:var(--kcal)} .chip.ratio b{color:var(--pink)}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-top:10px}
.badge.inflated{background:#3d1418;color:var(--bad);border:1px solid #5c1f26}
.badge.ok{background:#0e2a18;color:var(--good);border:1px solid #1c4a2b}
.badge.close{background:#332408;color:var(--warn);border:1px solid #55400f}
.detail{display:none}
.detail.show{display:block}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;padding:14px 4px 10px;cursor:pointer;background:none;border:none}
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.hero img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.srcbtn{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;backdrop-filter:blur(6px)}
h2.dt{font-size:24px;font-weight:800;letter-spacing:-.3px;margin:14px 2px 2px}
.byline{color:var(--muted);font-size:13px;margin-bottom:14px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.mbox .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.mbox .big{font-size:20px;font-weight:800;margin-top:2px}
.mbox .sm{font-size:11px;color:var(--muted)}
.mbox.k .big{color:var(--kcal)} .mbox.p .big{color:var(--protein)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mini .mbox{padding:8px 10px}
.mini .big{font-size:15px}
.claim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.claim .t{font-weight:700;font-size:14px}
.claim .claimtxt{color:var(--muted);font-size:13px;margin-top:4px}
h3.sec{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 2px 10px}
.ing{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.ing .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px}
.ing .row+.row{border-top:1px solid var(--line)}
.ing .nm{font-weight:600;font-size:14px}
.ing .amt{color:var(--muted);font-size:12px}
.ing .nums{display:flex;gap:10px;font-size:13px;white-space:nowrap}
.ing .nums span b{font-weight:800}
.n-k{color:var(--kcal)} .n-p{color:var(--protein)}
.price{color:var(--muted);font-size:12px}
.price b{color:var(--text)}
.wl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wlink{color:var(--protein);text-decoration:none;font-size:12px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.total{display:flex;justify-content:space-between;padding:13px 14px;font-size:15px}
.total b{color:var(--protein);font-size:18px}
ol.steps{margin:4px 0 0 20px;color:var(--text)}
ol.steps li{margin-bottom:6px;font-size:14px}
.note{background:var(--card);border-left:3px solid var(--pink);border-radius:0 12px 12px 0;padding:10px 14px;font-size:13px;color:var(--text);margin-bottom:8px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 34px}
.empty{color:var(--muted);text-align:center;padding:60px 0;font-size:15px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer>Andrzej 🤖 • macrosy z Willys API • miniaturki z klatek filmów<br>przepisy.codingwithdawid.com</footer>
<script src="recipes.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('sv-SE');
const kr=n=>n.toLocaleString('sv-SE',{minimumFractionDigits:0,maximumFractionDigits:2})+' kr';
let view='list', openId=null, tagFilter=null, q='';

function per100(r,k){return r.totalWeightG? r.totals[k]/(r.totalWeightG/100) : null}
function perServ(r,k){return r.totals[k]/(r.servings)}
function ratioP100kcal(r){return r.totals.kcal? r.totals.protein/r.totals.kcal*100 : 0}

const BADGE={inflated:['⚠️ claim zawyżony','inflated'],ok:['✅ claim się zgadza','ok'],close:['≈ claim blisko prawdy','close']};

function renderList(){
  const list=window.RECIPES.filter(r=>{
    if(tagFilter && !(r.tags||[]).includes(tagFilter)) return false;
    if(q && !(r.title+' '+r.author+' '+(r.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  const allTags=[...new Set(window.RECIPES.flatMap(r=>r.tags||[]))];
  $('#app').innerHTML=`
    <header><span class="logo">🍽️</span><div><h1>Przepisy</h1><div class="sub">macros liczone z prawdziwych produktów Willys</div></div></header>
    <input class="search" placeholder="Szukaj przepisu, autora, tagu…" value="${q}" oninput="q=this.value;renderList()">
    <div class="tags">${['Wszystko',...allTags].map(t=>`<div class="tag ${ (t==='Wszystko'&&!tagFilter)||(t===tagFilter)?'on':''}" onclick="tagFilter=${t==='Wszystko'?'null':`'${t}'`};renderList()">${t}</div>`).join('')}</div>
    ${list.length?list.map(card).join(''):'<div class="empty">Nic nie znalazłem 🤷</div>'}`;
}
function card(r){
  const b=BADGE[r.claim?.verdict]||null;
  return `<div class="card" onclick="openR('${r.id}')">
    <img src="${r.image}" alt="${r.title}" loading="lazy">
    <div class="body">
      <h2>${r.title}</h2>
      <div class="by">${r.platform==='tiktok'?'🎵':'📸'} ${r.author} • ${r.servings} porcji</div>
      <div class="kpis">
        <span class="chip kc"><b>${fmt(perServ(r,'kcal'))}</b>kcal/por</span>
        <span class="chip pk"><b>${fmt(perServ(r,'protein'))}g</b>P/por</span>
        <span class="chip ratio"><b>${ratioP100kcal(r).toFixed(1)}g</b>P/100kcal</span>
      </div>
      ${b?`<span class="badge ${b[1]}">${b[0]}</span>`:''}
    </div>
  </div>`;
}
function openR(id){openId=id;view='detail';renderDetail();window.scrollTo(0,0)}
function back(){view='list';openId=null;renderList();window.scrollTo(0,0)}

function renderDetail(){
  const r=window.RECIPES.find(x=>x.id===openId); if(!r){back();return}
  const w=r.totalWeightG/100, totPrice=r.ingredients.reduce((s,i)=>s+(i.price||0),0);
  const b=BADGE[r.claim?.verdict];
  $('#app').innerHTML=`
  <button class="back" onclick="back()">← Wszystkie przepisy</button>
  <div class="hero"><img src="${r.image}" alt="${r.title}">
    <a class="srcbtn" href="${r.sourceUrl}" target="_blank" rel="noopener">${r.platform==='tiktok'?'🎵 Otwórz na TikToku':'📸 Otwórz na IG'}</a>
  </div>
  <h2 class="dt">${r.title}</h2>
  <div class="byline">${r.author} • dodane ${r.addedAt} • ${r.servings} porcji • całość ~${fmt(r.totalWeightG)}g</div>
  <div class="macros">
    <div class="mbox k"><div class="lbl">kcal całość</div><div class="big">${fmt(r.totals.kcal)}</div><div class="sm">${fmt(perServ(r,'kcal'))}/porcję</div></div>
    <div class="mbox p"><div class="lbl">protein całość</div><div class="big">${fmt(r.totals.protein)}g</div><div class="sm">${fmt(perServ(r,'protein'))}g/porcję</div></div>
    <div class="mbox"><div class="lbl">ratio</div><div class="big" style="color:var(--pink)">${ratioP100kcal(r).toFixed(1)}g</div><div class="sm">P / 100 kcal</div></div>
  </div>
  <div class="mini">
    <div class="mbox"><div class="lbl">per 100g</div><div class="big">${fmt(per100(r,'kcal'))} kcal</div><div class="sm">${fmt(per100(r,'protein'))}g P</div></div>
    <div class="mbox"><div class="lbl">kolhydraty</div><div class="big" style="color:var(--carbs)">${fmt(r.totals.carbs)}g</div><div class="sm">${fmt(per100(r,'carbs'))}g/100g</div></div>
    <div class="mbox"><div class="lbl">tłuszcz</div><div class="big" style="color:var(--fat)">${fmt(r.totals.fat)}g</div><div class="sm">${fmt(per100(r,'fat'))}g/100g</div></div>
  </div>
  ${r.claim?`<div class="claim"><div class="t">${b[0]}</div><div class="claimtxt">Autor twierdzi: „${r.claim.text}" — ${r.claim.note}</div></div>`:''}
  <h3 class="sec">Składniki (macrosy z Willys)</h3>
  ${r.ingredients.map(i=>`<div class="ing"><div class="row">
    <div class="wl"><div><div class="nm">${i.name}${i.brand&&i.brand!=='—'?` <span class="amt">· ${i.brand}</span>`:''}</div><div class="amt">${i.amount}</div></div></div>
    <div class="nums"><span class="n-k"><b>${fmt(i.kcal)}</b> kcal</span><span class="n-p"><b>${i.protein.toFixed(1)}g</b> P</span></div>
  </div>
  ${(i.willys||i.price)?`<div class="row"><div class="price">${i.price?`Willys: <b>${kr(i.price)}</b>${i.priceNote?` (${i.priceNote})`:''}`:'—'}</div>${i.willys?`<a class="wlink" href="${i.willys}" target="_blank" rel="noopener">Willys ↗</a>`:''}</div>`:''}
  </div>`).join('')}
  <div class="ing"><div class="total"><span>Koszt całości (Willys)</span><b>${kr(totPrice)}</b></div></div>
  <h3 class="sec">Wykonanie</h3>
  <ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  ${r.notes&&r.notes.length?`<h3 class="sec">Uwagi Andrzejа</h3>${r.notes.map(n=>`<div class="note">${n}</div>`).join('')}`:''}`;
}
renderList();
</script>
</body>
</html>
